# Runs the three gates that previously only ran by hand: typecheck, unit tests, production build.
#
# WHY THIS EXISTS. Until now every gate was run manually before a merge, and on 2026-08-06 twenty
# PRs merged that way. Two things went wrong that a machine would have caught: a verification
# harness ran AFTER a merge instead of before, and a broken test reached main and sat there for
# hours until an unrelated baseline run happened to surface it. Both were caught by a human
# remembering to look.
#
# DELIBERATELY MINIMAL. No deploy step (Vercel owns deployment), no Playwright (slow, needs a live
# environment, and its own decision), no coverage thresholds, no lint rules nobody agreed to.
# Three gates, matching what the team already runs by hand.
#
# NOT A REQUIRED STATUS CHECK YET. Let it run on real PRs first and confirm it is not flaky before
# anyone is blocked by it — a CI that cries wolf gets ignored, which is worse than having none.

name: CI

on:
  pull_request:
    branches: [main]

# A PR that gets three pushes in a minute should not run three builds. Cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: typecheck / unit / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # NOT SECRETS, and deliberately so. `next build` was measured to succeed with NO environment
      # at all, and with these placeholders it produces an IDENTICAL route table (223 routes) and
      # the same 1897/1897 prerendered pages as a build using the real .env.local — so nothing here
      # reaches a network and CI is not checking less than production does.
      #
      # They are set anyway because an unset NEXT_PUBLIC_SUPABASE_URL and a placeholder one fail in
      # very different ways, and the placeholder is the production-shaped one. If a future change
      # makes the build genuinely require a real credential, that is a decision to bring to the
      # owner — do not put a secret in this file.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://www.joinzer.com
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      RESEND_API_KEY: re_placeholder
      CRON_SECRET: placeholder-cron-secret
      UNSUBSCRIBE_SECRET: placeholder-unsubscribe-secret

    steps:
      - uses: actions/checkout@v4

      # Node 24 matches the Vercel project's configured nodeVersion ("24.x"), read from the project
      # settings rather than guessed — package.json has no `engines` field to pin it. If Vercel's
      # Node version is ever changed, change it here in the same commit.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci`, not `npm install`: installs exactly the lockfile and never rewrites it.
      # setup-node's `cache: npm` above restores the npm download cache, which is what makes this
      # fast on a warm run — caching node_modules itself is fragile across lockfile changes.
      - name: Install dependencies
        run: npm ci

      # Each gate reports independently. Without `!cancelled()` a tsc failure would hide whether the
      # tests and build also broke, turning one red run into three sequential round trips.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npx vitest run

      - name: Production build
        if: ${{ !cancelled() }}
        run: npx next build
